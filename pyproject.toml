[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ogentic-adapter-sdk"
version = "0.1.0"
description = "The Adapter protocol — the contract any LLM backend implements so ogentic-router can call it."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "David Oladeji", email = "david@ogentic.ai" },
]
keywords = ["llm", "adapter", "protocol", "ogentic", "router"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.13"]

[project.urls]
Homepage      = "https://github.com/OgenticAI/ogentic-adapter-sdk"
Repository    = "https://github.com/OgenticAI/ogentic-adapter-sdk"
Issues        = "https://github.com/OgenticAI/ogentic-adapter-sdk/issues"
Documentation = "https://github.com/OgenticAI/ogentic-adapter-sdk#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/ogentic_adapter_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
